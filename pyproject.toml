[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name        = "ymap"
version     = "1.0.0"
description = "Ymap v1.0.0 — Yung Mapper — a lightweight, easy-to-remember network scanner"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.8"

keywords = [
    "network", "scanner", "nmap", "security", "pentesting",
    "port-scanner", "vulnerability", "CVE", "recon",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Security",
]

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------
dependencies = [
    "click>=8.1",          # CLI framework
    "rich>=13.0",          # Beautiful terminal output
    "scapy>=2.5",          # Raw packet crafting (SYN, UDP, ARP, ICMP)
    "requests>=2.28",
    "python-dotenv>=1.0",      # HTTP calls to NIST NVD API
]

# ---------------------------------------------------------------------------
# Optional extras
# ---------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "black",
    "isort",
    "mypy",
]

# ---------------------------------------------------------------------------
# CLI entry-point
# ---------------------------------------------------------------------------
[project.scripts]
ymap = "ymap.cli:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["ymap*"]

[tool.black]
line-length = 90
target-version = ["py38"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
